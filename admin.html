<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Panel — Lexbility</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --navy:   #0A1628;
      --navy2:  #0f1f3d;
      --gold:   #C9A84C;
      --gold2:  #e8c56a;
      --white:  #FFFFFF;
      --grey:   #F4F6FA;
      --text:   #1a2340;
      --muted:  #6b7a99;
      --green:  #3a9d63;
      --red:    #c9504c;
    }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--grey);
      color: var(--text);
      min-height: 100vh;
    }

    /* ─── NAVBAR ─────────────────────────────────────── */
    nav {
      background: var(--navy);
      padding: 0 5%;
      height: 64px;
      display: flex;
      align-items: center;
      border-bottom: 1px solid rgba(201,168,76,0.2);
    }
    .nav-logo {
      font-family: 'Playfair Display', serif;
      font-size: 1.5rem;
      font-weight: 900;
      color: var(--white);
      letter-spacing: -0.5px;
    }
    .nav-logo span { color: var(--gold); }
    .nav-tag {
      margin-left: 0.9rem;
      font-size: 0.78rem;
      font-weight: 600;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: rgba(201,168,76,0.75);
      border-left: 1px solid rgba(255,255,255,0.15);
      padding-left: 0.9rem;
    }

    /* ─── LOGIN ──────────────────────────────────────── */
    #loginSection {
      text-align: center;
      margin: 6rem auto;
      max-width: 420px;
      background: var(--white);
      padding: 3rem 2.5rem;
      border-radius: 14px;
      border: 1px solid rgba(10,22,40,0.06);
      box-shadow: 0 12px 40px rgba(10,22,40,0.08);
    }
    #loginSection h2 {
      font-family: 'Playfair Display', serif;
      font-size: 1.7rem;
      color: var(--navy);
      margin-bottom: 0.5rem;
    }
    #loginSection p.sub {
      color: var(--muted);
      font-size: 0.92rem;
      margin-bottom: 2rem;
    }
    #loginBtn {
      background: var(--gold);
      color: var(--navy);
      border: 2px solid var(--gold);
      padding: 0.8rem 2rem;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.95rem;
      font-weight: 700;
      font-family: inherit;
      transition: all 0.2s;
    }
    #loginBtn:hover { background: var(--gold2); border-color: var(--gold2); transform: translateY(-2px); }

    /* ─── ACCESS DENIED ──────────────────────────────── */
    #accessDenied {
      display: none;
      text-align: center;
      margin: 6rem auto;
      max-width: 480px;
      background: var(--white);
      padding: 2.5rem;
      border-radius: 14px;
      border: 1px solid rgba(201,80,76,0.25);
      color: var(--red);
      font-family: 'Playfair Display', serif;
      font-size: 1.4rem;
      font-weight: 700;
      box-shadow: 0 12px 40px rgba(10,22,40,0.06);
    }

    /* ─── ADMIN PANEL ────────────────────────────────── */
    #adminPanel { display: none; max-width: 900px; margin: 0 auto; padding: 3rem 5% 5rem; }

    .panel-heading {
      text-align: center;
      margin-bottom: 2rem;
    }
    .panel-heading .section-label {
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: var(--gold);
      margin-bottom: 0.4rem;
    }
    .panel-heading h2 {
      font-family: 'Playfair Display', serif;
      font-size: clamp(1.6rem, 3.5vw, 2.2rem);
      font-weight: 700;
      color: var(--navy);
    }
    .panel-heading.second { margin-top: 3.5rem; }

    /* ─── CARD ───────────────────────────────────────── */
    .card {
      background: var(--white);
      border-radius: 12px;
      padding: 1.8rem;
      margin-bottom: 1.5rem;
      border: 1px solid rgba(10,22,40,0.06);
      transition: all 0.25s;
    }
    .card:hover { box-shadow: 0 12px 40px rgba(10,22,40,0.08); border-color: var(--gold); }

    .card h3 {
      font-family: 'Playfair Display', serif;
      color: var(--navy);
      font-size: 1.3rem;
      font-weight: 700;
      margin: 0.8rem 0 0.6rem;
    }
    .card p {
      color: var(--muted);
      line-height: 1.65;
      white-space: pre-wrap;
      font-size: 0.95rem;
    }

    .author { display: flex; align-items: center; gap: 10px; margin-bottom: 0.4rem; }
    .author img {
      width: 42px; height: 42px;
      border-radius: 50%;
      border: 2px solid var(--gold);
      object-fit: cover;
    }
    .author strong { color: var(--navy); font-size: 0.95rem; }
    .author small { color: var(--muted); font-size: 0.8rem; }

    .category-badge {
      display: inline-block;
      background: rgba(201,168,76,0.12);
      border: 1px solid rgba(201,168,76,0.35);
      color: #9c7e2e;
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      padding: 0.3rem 0.8rem;
      border-radius: 20px;
    }

    .btns { display: flex; gap: 0.9rem; margin-top: 1.3rem; }

    .approveBtn, .rejectBtn {
      border: none;
      padding: 0.65rem 1.6rem;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.9rem;
      font-weight: 600;
      font-family: inherit;
      transition: all 0.2s;
    }
    .approveBtn { background: var(--green); color: var(--white); }
    .approveBtn:hover { background: #2f8552; transform: translateY(-1px); }
    .rejectBtn { background: var(--red); color: var(--white); }
    .rejectBtn:hover { background: #b3413d; transform: translateY(-1px); }

    .empty-msg {
      text-align: center;
      color: var(--muted);
      font-size: 0.95rem;
      padding: 2rem 0;
    }
  </style>
</head>
<body>

<nav>
  <span class="nav-logo">Lex<span>bility</span></span>
  <span class="nav-tag">Admin Panel</span>
</nav>

<div id="loginSection">
  <h2>Admin Login</h2>
  <p class="sub">Sign in to manage articles.</p>
  <button id="loginBtn" onclick="adminLogin()">Sign in with Google</button>
</div>

<div id="accessDenied">
  ❌ Access Denied — Tumhara account admin nahi hai!
</div>

<div id="adminPanel">
  <div class="panel-heading">
    <div class="section-label">Review Queue</div>
    <h2>Pending Articles</h2>
  </div>
  <div id="pendingList">Loading...</div>

  <div class="panel-heading second">
    <div class="section-label">Live On Site</div>
    <h2>Published Articles</h2>
  </div>
  <div id="publishedList">Loading...</div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
  import { getFirestore, collection, getDocs, addDoc, deleteDoc, doc, serverTimestamp, query, orderBy } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDEvGKpkZLH9zfmy7oV1sJJxArAZ5Hjv7k",
    authDomain: "lexbility-fda92.firebaseapp.com",
    projectId: "lexbility-fda92",
    storageBucket: "lexbility-fda92.firebasestorage.app",
    messagingSenderId: "855790706525",
    appId: "1:855790706525:web:509d8dc087f1c24a7f92b4",
    measurementId: "G-C9R0GRJ464"
  };

   const ADMIN_UID = '9wksZduLBDQaKBCPpDlqaNaouNn2';

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);
  const provider = new GoogleAuthProvider();

  onAuthStateChanged(auth, async (user) => {
    if (!user) {
      document.getElementById('loginSection').style.display = 'block';
      document.getElementById('adminPanel').style.display = 'none';
      return;
    }

    document.getElementById('loginSection').style.display = 'none';
    if (user.uid !== ADMIN_UID && ADMIN_UID !== 'TUMHARA_UID_YAHAN') {
      document.getElementById('accessDenied').style.display = 'block';
      return;
    }

    document.getElementById('adminPanel').style.display = 'block';
    loadPending();
    loadPublished();
  });

  window.adminLogin = async () => {
    try {
      await signInWithPopup(auth, provider);
    } catch(e) {
      alert('Login failed: ' + e.message);
    }
  };

  async function loadPending() {
    const q = query(collection(db, 'pending'));
    const snapshot = await getDocs(q);
    const list = document.getElementById('pendingList');

    if (snapshot.empty) {
      list.innerHTML = '<p class="empty-msg">Koi pending article nahi hai 🎉</p>';
      return;
    }

    list.innerHTML = '';
    snapshot.forEach(docSnap => {
      const a = docSnap.data();
      const div = document.createElement('div');
      div.className = 'card';
      div.innerHTML = `
        <div class="author">
          <img src="${a.authorPhoto}" alt="${a.authorName}">
          <div>
            <strong>${a.authorName}</strong><br>
            <small>${a.authorEmail}</small>
          </div>
        </div>
        <span class="category-badge">${a.category}</span>
        <h3>${a.title}</h3>
        <p>${a.content}</p>
        <div class="btns">
          <button class="approveBtn" onclick="approve('${docSnap.id}')">✅ Approve</button>
          <button class="rejectBtn" onclick="reject('${docSnap.id}')">❌ Reject</button>
        </div>
      `;
      list.appendChild(div);
    });
  }

  window.approve = async (id) => {
    const docRef = doc(db, 'pending', id);
    const snapshot = await getDocs(collection(db, 'pending'));
    const found = snapshot.docs.find(d => d.id === id);
    if (!found) return;

    const data = found.data();
    await addDoc(collection(db, 'articles'), {
      ...data,
      status: 'approved',
      approvedAt: serverTimestamp()
    });
    await deleteDoc(docRef);
    alert('✅ Article approved & published!');
    loadPending();
  };

  window.reject = async (id) => {
    if (!confirm('Sure ho? Ye article delete ho jayega.')) return;
    await deleteDoc(doc(db, 'pending', id));
    alert('❌ Article reject kar diya.');
    loadPending();
  };

  async function loadPublished() {
    const snapshot = await getDocs(collection(db, 'articles'));
    const list = document.getElementById('publishedList');

    if (snapshot.empty) {
      list.innerHTML = '<p class="empty-msg">Koi published article nahi hai abhi.</p>';
      return;
    }

    list.innerHTML = '';
    snapshot.forEach(docSnap => {
      const a = docSnap.data();
      const div = document.createElement('div');
      div.className = 'card';
      div.innerHTML = `
        <div class="author">
          <img src="${a.authorPhoto}" alt="${a.authorName}">
          <div>
            <strong>${a.authorName}</strong><br>
            <small>${a.authorEmail}</small>
          </div>
        </div>
        <span class="category-badge">${a.category}</span>
        <h3>${a.title}</h3>
        <p>${a.content}</p>
        <div class="btns">
          <button class="rejectBtn" onclick="deletePublished('${docSnap.id}')">🗑️ Delete</button>
        </div>
      `;
      list.appendChild(div);
    });
  }

  window.deletePublished = async (id) => {
    if (!confirm('Sure ho? Ye published article site se permanently delete ho jayega.')) return;
    await deleteDoc(doc(db, 'articles', id));
    alert('🗑️ Article delete kar diya gaya.');
    loadPublished();
  };
</script>

</body>
</html>
