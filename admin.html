<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Panel — Lexbility</title>
  <style>
    body { font-family: 'Segoe UI', sans-serif; background: #f0f0f0; margin: 0; }
    nav { background: #1a1a2e; padding: 1rem 2rem; color: white; font-size: 1.2rem; font-weight: bold; }
    #loginSection { text-align: center; margin: 4rem; }
    #loginBtn { background: white; border: 2px solid #1a1a2e; padding: 0.7rem 2rem; border-radius: 8px; cursor: pointer; font-size: 1rem; }
    #adminPanel { display: none; max-width: 900px; margin: 2rem auto; }
    .card { background: white; border-radius: 12px; padding: 1.5rem; margin-bottom: 1.5rem; box-shadow: 0 2px 12px rgba(0,0,0,0.08); }
    .card h3 { color: #1a1a2e; margin-bottom: 0.5rem; }
    .card p { color: #555; line-height: 1.6; white-space: pre-wrap; }
    .meta { font-size: 0.85rem; color: #888; margin-bottom: 1rem; }
    .author { display: flex; align-items: center; gap: 8px; margin-bottom: 1rem; }
    .author img { width: 40px; height: 40px; border-radius: 50%; }
    .btns { display: flex; gap: 1rem; margin-top: 1rem; }
    .approveBtn { background: #28a745; color: white; border: none; padding: 0.6rem 1.5rem; border-radius: 8px; cursor: pointer; font-size: 0.95rem; }
    .rejectBtn { background: #e94560; color: white; border: none; padding: 0.6rem 1.5rem; border-radius: 8px; cursor: pointer; font-size: 0.95rem; }
    #accessDenied { display: none; text-align: center; margin: 4rem; color: #e94560; font-size: 1.5rem; }
    #uidBox { background: #fff3cd; border: 1px solid #ffc107; padding: 1rem; border-radius: 8px; margin: 1rem auto; max-width: 600px; text-align: center; word-break: break-all; }
  </style>
</head>
<body>

<nav>⚖️ Lexbility — Admin Panel</nav>

<div id="loginSection">
  <h2>Admin Login</h2>
  <button id="loginBtn" onclick="adminLogin()">
    Sign in with Google
  </button>
</div>

<div id="accessDenied">
  ❌ Access Denied — Tumhara account admin nahi hai!
</div>

<div id="adminPanel">
  <h2 style="text-align:center; color:#1a1a2e;">Pending Articles</h2>
 
  <div id="pendingList">Loading...</div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
  import { getFirestore, collection, getDocs, addDoc, deleteDoc, doc, serverTimestamp, query, orderBy } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDEvGKpkZLH9zfmy7oV1sJJxArAZ5Hjv7k",
    authDomain: "lexbility-fda92.firebaseapp.com",
    projectId: "lexbility-fda92",
    storageBucket: "lexbility-fda92.firebasestorage.app",
    messagingSenderId: "855790706525",
    appId: "1:855790706525:web:509d8dc087f1c24a7f92b4",
    measurementId: "G-C9R0GRJ464"
  };

   const ADMIN_UID = '9wksZduLBDQaKBCPpDlqaNaouNn2';

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);
  const provider = new GoogleAuthProvider();

  onAuthStateChanged(auth, async (user) => {
    if (!user) {
      document.getElementById('loginSection').style.display = 'block';
      document.getElementById('adminPanel').style.display = 'none';
      return;
    }

    document.getElementById('loginSection').style.display = 'none';
    document.getElementById('uidDisplay').textContent = user.uid;

    if (user.uid !== ADMIN_UID && ADMIN_UID !== 'TUMHARA_UID_YAHAN') {
      document.getElementById('accessDenied').style.display = 'block';
      return;
    }

    document.getElementById('adminPanel').style.display = 'block';
    loadPending();
  });

  window.adminLogin = async () => {
    try {
      await signInWithPopup(auth, provider);
    } catch(e) {
      alert('Login failed: ' + e.message);
    }
  };

  async function loadPending() {
    const q = query(collection(db, 'pending'));
    const snapshot = await getDocs(q);
    const list = document.getElementById('pendingList');

    if (snapshot.empty) {
      list.innerHTML = '<p style="text-align:center;color:#999;">Koi pending article nahi hai 🎉</p>';
      return;
    }

    list.innerHTML = '';
    snapshot.forEach(docSnap => {
      const a = docSnap.data();
      const div = document.createElement('div');
      div.className = 'card';
      div.innerHTML = `
        <div class="author">
          <img src="${a.authorPhoto}" alt="${a.authorName}">
          <div>
            <strong>${a.authorName}</strong><br>
            <small>${a.authorEmail}</small>
          </div>
        </div>
        <span style="background:#6c757d;color:white;padding:2px 10px;border-radius:20px;font-size:0.8rem;">${a.category}</span>
        <h3>${a.title}</h3>
        <p>${a.content}</p>
        <div class="btns">
          <button class="approveBtn" onclick="approve('${docSnap.id}')">✅ Approve</button>
          <button class="rejectBtn" onclick="reject('${docSnap.id}')">❌ Reject</button>
        </div>
      `;
      list.appendChild(div);
    });
  }

  window.approve = async (id) => {
    const docRef = doc(db, 'pending', id);
    const snapshot = await getDocs(collection(db, 'pending'));
    const found = snapshot.docs.find(d => d.id === id);
    if (!found) return;

    const data = found.data();
    await addDoc(collection(db, 'articles'), {
      ...data,
      status: 'approved',
      approvedAt: serverTimestamp()
    });
    await deleteDoc(docRef);
    alert('✅ Article approved & published!');
    loadPending();
  };

  window.reject = async (id) => {
    if (!confirm('Sure ho? Ye article delete ho jayega.')) return;
    await deleteDoc(doc(db, 'pending', id));
    alert('❌ Article reject kar diya.');
    loadPending();
  };
</script>

</body>
</html>
