<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Articles — Lexbility</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body { font-family: 'Segoe UI', sans-serif; background: #f9f9f9; margin: 0; }
    nav { background: #1a1a2e; padding: 1rem 2rem; display: flex; justify-content: space-between; align-items: center; }
    nav a { color: white; text-decoration: none; font-weight: bold; font-size: 1.2rem; }
    nav button { background: #e94560; color: white; border: none; padding: 0.5rem 1.2rem; border-radius: 6px; cursor: pointer; font-size: 0.95rem; }
    .hero { text-align: center; padding: 3rem 1rem 1rem; }
    .hero h1 { font-size: 2rem; color: #1a1a2e; }
    .hero p { color: #555; }
    #loginSection { text-align: center; margin: 2rem; }
    #loginBtn { background: white; border: 2px solid #1a1a2e; padding: 0.7rem 2rem; border-radius: 8px; cursor: pointer; font-size: 1rem; display: inline-flex; align-items: center; gap: 10px; }
    #writeSection { display: none; max-width: 700px; margin: 2rem auto; background: white; padding: 2rem; border-radius: 12px; box-shadow: 0 2px 12px rgba(0,0,0,0.08); }
    #writeSection h2 { color: #1a1a2e; margin-bottom: 1rem; }
    #writeSection input, #writeSection textarea { width: 100%; padding: 0.8rem; margin-bottom: 1rem; border: 1px solid #ddd; border-radius: 8px; font-size: 1rem; box-sizing: border-box; }
    #writeSection textarea { height: 200px; resize: vertical; }
    #submitBtn { background: #e94560; color: white; border: none; padding: 0.8rem 2rem; border-radius: 8px; cursor: pointer; font-size: 1rem; width: 100%; }
    #submitBtn:hover { background: #c73652; }
    #userInfo { display: none; text-align: center; margin: 1rem; color: #333; }
    #userInfo img { width: 40px; height: 40px; border-radius: 50%; vertical-align: middle; margin-right: 8px; }
    .articles-grid { max-width: 900px; margin: 2rem auto; display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 1.5rem; padding: 0 1rem; }
    .article-card { background: white; border-radius: 12px; padding: 1.5rem; box-shadow: 0 2px 12px rgba(0,0,0,0.08); }
    .article-card h3 { color: #1a1a2e; margin-bottom: 0.5rem; }
    .article-card p { color: #555; font-size: 0.9rem; line-height: 1.6; }
    .author { display: flex; align-items: center; gap: 8px; margin-top: 1rem; padding-top: 1rem; border-top: 1px solid #eee; }
    .author img { width: 35px; height: 35px; border-radius: 50%; }
    .author span { font-size: 0.85rem; color: #777; }
    #message { text-align: center; padding: 1rem; color: green; display: none; font-weight: bold; }
    #pendingMsg { background: #fff3cd; border: 1px solid #ffc107; padding: 1rem; border-radius: 8px; margin-bottom: 1rem; color: #856404; text-align: center; display: none; }
  </style>
</head>
<body>

<nav>
  <a href="index.html">⚖️ Lexbility</a>
  <button onclick="window.location.href='index.html'">← Home</button>
</nav>

<div class="hero">
  <h1>📝 Articles</h1>
  <p>Legal knowledge shared by students & advocates</p>
</div>

<div id="loginSection">
  <button id="loginBtn" onclick="loginWithGoogle()">
    <img src="https://www.google.com/favicon.ico" width="20"> Sign in with Google to Write
  </button>
</div>

<div id="userInfo">
  <img id="userPhoto" src="" alt="">
  <span id="userName"></span>
  &nbsp;|&nbsp;
  <a href="#" onclick="logout()" style="color:#e94560;">Logout</a>
</div>

<div id="writeSection">
  <h2>✍️ Write an Article</h2>
  <div id="pendingMsg">⏳ Tumhara article review ke liye submit ho gaya! Approve hone ke baad dikhega.</div>
  <input type="text" id="articleTitle" placeholder="Article ka Title *" maxlength="100">
  <input type="text" id="articleCategory" placeholder="Category (e.g. Constitutional Law, IPC, etc.) *" maxlength="50">
  <textarea id="articleContent" placeholder="Article likho yahan... (minimum 200 words)"></textarea>
  <button id="submitBtn" onclick="submitArticle()">Submit for Review →</button>
</div>

<div id="message">✅ Article submit ho gaya! Review ke baad publish hoga.</div>

<h2 style="text-align:center; color:#1a1a2e; margin-top:2rem;">Published Articles</h2>
<div class="articles-grid" id="articlesGrid">
  <p style="text-align:center; color:#999; grid-column:1/-1;">Loading articles...</p>
</div>

<!-- Firebase -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
  import { getFirestore, collection, addDoc, getDocs, query, where, orderBy, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDEvGKpkZLH9zfmy7oV1sJJxArAZ5Hjv7k",
    authDomain: "lexbility-fda92.firebaseapp.com",
    projectId: "lexbility-fda92",
    storageBucket: "lexbility-fda92.firebasestorage.app",
    messagingSenderId: "855790706525",
    appId: "1:855790706525:web:509d8dc087f1c24a7f92b4",
    measurementId: "G-C9R0GRJ464"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);
  const provider = new GoogleAuthProvider();

  let currentUser = null;

  // Auth state
  onAuthStateChanged(auth, (user) => {
    if (user) {
      currentUser = user;
      document.getElementById('loginSection').style.display = 'none';
      document.getElementById('userInfo').style.display = 'block';
      document.getElementById('writeSection').style.display = 'block';
      document.getElementById('userPhoto').src = user.photoURL;
      document.getElementById('userName').textContent = user.displayName;
      
      // Show UID in console (for admin setup)
      console.log('Your UID:', user.uid);
    } else {
      currentUser = null;
      document.getElementById('loginSection').style.display = 'block';
      document.getElementById('userInfo').style.display = 'none';
      document.getElementById('writeSection').style.display = 'none';
    }
  });

  // Login
  window.loginWithGoogle = async () => {
    try {
      await signInWithPopup(auth, provider);
    } catch (e) {
      alert('Login failed: ' + e.message);
    }
  };

  // Logout
  window.logout = async () => {
    await signOut(auth);
  };

  // Submit Article
  window.submitArticle = async () => {
    if (!currentUser) return alert('Pehle login karo!');
    
    const title = document.getElementById('articleTitle').value.trim();
    const category = document.getElementById('articleCategory').value.trim();
    const content = document.getElementById('articleContent').value.trim();
    
    if (!title || !category || !content) return alert('Sab fields fill karo!');
    if (content.split(' ').length < 50) return alert('Article thoda lamba likho (minimum 50 words)!');
    
    try {
      document.getElementById('submitBtn').textContent = 'Submitting...';
      document.getElementById('submitBtn').disabled = true;
      
      await addDoc(collection(db, 'pending'), {
        title,
        category,
        content,
        authorName: currentUser.displayName,
        authorPhoto: currentUser.photoURL,
        authorEmail: currentUser.email,
        authorUID: currentUser.uid,
        status: 'pending',
        createdAt: serverTimestamp()
      });
      
      document.getElementById('articleTitle').value = '';
      document.getElementById('articleCategory').value = '';
      document.getElementById('articleContent').value = '';
      document.getElementById('pendingMsg').style.display = 'block';
      document.getElementById('submitBtn').textContent = 'Submit for Review →';
      document.getElementById('submitBtn').disabled = false;
      
    } catch (e) {
      alert('Error: ' + e.message);
      document.getElementById('submitBtn').textContent = 'Submit for Review →';
      document.getElementById('submitBtn').disabled = false;
    }
  };

  // Load approved articles
  async function loadArticles() {
    try {
     const q = query(
  collection(db, 'articles'),
  where('status', '==', 'approved')
);
      const snapshot = await getDocs(q);
      const grid = document.getElementById('articlesGrid');
      
      if (snapshot.empty) {
        grid.innerHTML = '<p style="text-align:center; color:#999; grid-column:1/-1;">Abhi koi article nahi hai. Pehle likhne wale bano! ✍️</p>';
        return;
      }
      
      grid.innerHTML = '';
      snapshot.forEach(doc => {
        const a = doc.data();
        const preview = a.content.substring(0, 150) + '...';
       grid.innerHTML += `
  <div class="article-card" onclick="window.location.href='article.html?id=${doc.id}'" style="cursor:pointer;">
    <span style="background:#e94560;color:white;padding:2px 10px;border-radius:20px;font-size:0.8rem;">${a.category}</span>
    <h3 style="margin-top:0.8rem;">${a.title}</h3>
    <p>${preview}</p>
    <div class="author">
      <img src="${a.authorPhoto}" alt="${a.authorName}">
      <span>By <strong>${a.authorName}</strong></span>
    </div>
  </div>
`;
      });
    } catch (e) {
      console.error(e);
    }
  }

  loadArticles();
</script>

</body>
</html>
